name: Build & Release

# 推 tag 即自动构建并发版；也可在 Actions 页面手动指定一个已有 tag 重跑。
#
# 每次发版产出两个附件：
#   完整包 OFM_Gateway_Magisk_v<ver>.zip        约 35 MB，含 usr（Node 运行时）+ app
#   增量包 OFM_Gateway_Magisk_v<ver>_patch.zip  约  2 MB，只含 app
# 日常升级刷增量包即可；只有换 Node 运行时才需要完整包。
#
# usr 那 35 MB 不进仓库，也不在手机上上传：从基线 Release 的 zip 里取现成的 usr.tgz，
# 服务代码按 UPSTREAM_VERSION 从上游源码现场组装。成品在 runner 本地生成，
# 全程只走 GitHub 内网。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发版的 tag（必须已存在于仓库）'
        required: true
        type: string

permissions:
  contents: write

env:
  # 提供 usr（Node 运行时）的基线 Release。升级 Node 时改这里，
  # 前提是那个 tag 的 Release 里有带 runtime/usr.tgz（或老格式 runtime/runtime-arm64.tgz）的 zip。
  #
  # v0.4.2 发完之后建议改成 v0.4.2：那之后的基线是规整好的 usr.tgz，
  # 不必每次从老格式整包里抽 usr 重打（内容相同，只是省一步）。
  RUNTIME_BASE_TAG: v0.4.2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 解析本次的 tag 与版本号
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "tag 必须以 v 开头：$TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "本次构建：tag=$TAG"

      - name: 检出该 tag 的代码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: 核对 module.prop 与 update.json 的版本一致
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # build.sh 里也有同样的校验，这里提前跑一遍，
          # 让「版本号忘了改」在日志第一屏就暴露，而不是等到打包阶段
          PROP_VER=$(sed -n 's/^version=//p' module/module.prop)
          PROP_CODE=$(sed -n 's/^versionCode=//p' module/module.prop)
          JSON_VER=$(sed -n 's/.*"version": *"v\{0,1\}\([^"]*\)".*/\1/p' update.json)
          JSON_CODE=$(sed -n 's/.*"versionCode": *\([0-9][0-9]*\).*/\1/p' update.json)
          echo "module.prop: $PROP_VER ($PROP_CODE) / update.json: $JSON_VER ($JSON_CODE)"
          [ "$PROP_VER" = "$VERSION" ] || { echo "tag 是 $VERSION，module.prop 是 $PROP_VER" >&2; exit 1; }
          [ "$PROP_VER" = "$JSON_VER" ] || { echo "module.prop 与 update.json 的 version 不一致" >&2; exit 1; }
          [ "$PROP_CODE" = "$JSON_CODE" ] || { echo "module.prop 与 update.json 的 versionCode 不一致" >&2; exit 1; }

      - name: 从基线 Release 取 Node 运行时
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_TAG: ${{ env.RUNTIME_BASE_TAG }}
        run: |
          mkdir -p /tmp/base
          gh release download "$BASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'OFM_Gateway_Magisk_*.zip' \
            --dir /tmp/base
          ls -lh /tmp/base
          # 基线 Release 可能同时挂着完整包和 _patch 增量包（v0.4.2 起如此），
          # 直接拿通配符喂给 unzip 会因「匹配到多个」而失败，所以先挑出完整包
          BASE_ZIP=$(ls /tmp/base/OFM_Gateway_Magisk_*.zip | grep -v '_patch\.zip$' | head -n 1)
          [ -f "$BASE_ZIP" ] || { echo "基线包里找不到完整包 zip" >&2; exit 1; }
          echo "基线完整包：$(basename "$BASE_ZIP")"
          unzip -o -q "$BASE_ZIP" 'runtime/*' -d /tmp/base-x

          # 新格式直接有 usr.tgz；老格式（v0.4.1 及更早）只有整包 runtime-arm64.tgz，
          # build.sh 的 --usr 两种都能吃，这里统一成 usr 来源
          if [ -f /tmp/base-x/runtime/usr.tgz ]; then
            USR=/tmp/base-x/runtime/usr.tgz
          elif [ -f /tmp/base-x/runtime/runtime-arm64.tgz ]; then
            USR=/tmp/base-x/runtime/runtime-arm64.tgz
          else
            echo "基线包里没有 runtime/usr.tgz 或 runtime/runtime-arm64.tgz" >&2
            exit 1
          fi
          echo "OFM_USR=$USR" >> "$GITHUB_ENV"
          echo "运行时来自 $BASE_TAG：$(du -h "$USR" | cut -f1)"

      - name: 组装服务代码并打完整包
        env:
          OFM_BUILD_DIR: /tmp/ofm-build
        run: |
          # OFM_USR 由上一步写进 $GITHUB_ENV，这里直接读；
          # 不能用 ${{ env.xxx }} 引用它——那种写法在解析阶段就取值了，那时还是空的
          sh scripts/build.sh --usr "$OFM_USR"
          echo "OFM_ZIP=$(ls dist/OFM_Gateway_Magisk_v*[0-9].zip)" >> "$GITHUB_ENV"
          # build.sh 每次都会重建构建目录，增量包要复用这一步组装的 app，先挪出去
          cp -a "$OFM_BUILD_DIR/app" /tmp/app-stage
          ls -lh dist/

      - name: 打增量包
        env:
          OFM_BUILD_DIR: /tmp/ofm-build
        run: |
          # 复用上一步组装好的 app，避免重复拉上游源码
          sh scripts/build.sh --patch --app /tmp/app-stage --usr "$OFM_USR"
          echo "OFM_PATCH=$(ls dist/OFM_Gateway_Magisk_v*_patch.zip)" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: 生成 Release 正文
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 scripts/changelog-section.py "$VERSION" > /tmp/notes.md
          {
            cat /tmp/notes.md
            echo
            echo '---'
            echo
            echo '### 下载哪个'
            echo
            echo '| 文件 | 大小 | 什么时候下 |'
            echo '| --- | --- | --- |'
            echo '| `OFM_Gateway_Magisk_v'"$VERSION"'.zip` | 约 35 MB | 第一次装，或从很老的版本升级 |'
            echo '| `OFM_Gateway_Magisk_v'"$VERSION"'_patch.zip` | 约 2 MB | 已经装过 0.4.2 及以上，日常升级用这个 |'
            echo
            echo '增量包只含服务代码，安装时会核对设备上已有的 Node 运行时；'
            echo '对不上会直接报错让你改刷完整包，不会装出半套。'
            echo
            echo '### 安装'
            echo
            echo '下载后选「从本地安装」，重启手机。'
            echo
            echo '刷入方式与其他细节见 [README](https://github.com/'"$GITHUB_REPOSITORY"'#安装)。'
          } > /tmp/release-body.md
          echo "===== 正文 ====="; cat /tmp/release-body.md

      - name: 创建或更新 Release 并挂上附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新正文"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file /tmp/release-body.md
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file /tmp/release-body.md
          fi
          # 同名附件用 --clobber 覆盖：手动重跑工作流时不会因已存在而失败
          gh release upload "$TAG" "$OFM_ZIP" "$OFM_PATCH" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.state)  \(.size) bytes"'

      - name: 核对 update.json 里的 zipUrl 与产物对得上
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # 管理器内更新默认指向增量包：日常升级走的就是这条路。
          # 例外是「基线版本」（换 Node 或全新的包结构），那种版本必须指向完整包，
          # 否则老用户会被推到一个装不上的增量包上。指向哪个由 update.json 决定，
          # 这里只校验它确实是本次产出的两个附件之一，别写成上个月的包。
          BASE=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG
          FULL_NAME=$(basename "$OFM_ZIP")
          PATCH_NAME=$(basename "$OFM_PATCH")
          ACTUAL=$(sed -n 's/.*"zipUrl": *"\([^"]*\)".*/\1/p' update.json)
          case "$ACTUAL" in
            "$BASE/$FULL_NAME")  echo "管理器内更新 -> 完整包 $FULL_NAME" ;;
            "$BASE/$PATCH_NAME") echo "管理器内更新 -> 增量包 $PATCH_NAME" ;;
            *)
              echo "update.json 的 zipUrl 与本次产物不一致：" >&2
              echo "  只接受：$BASE/$FULL_NAME" >&2
              echo "     或： $BASE/$PATCH_NAME" >&2
              echo "  实际：  $ACTUAL" >&2
              exit 1 ;;
          esac
          echo "zipUrl 核对通过：$ACTUAL"
